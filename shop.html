<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annunci - Presto.it</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="index.html">Presto.it</a>
      <div>
        <a class="text-white me-3" href="index.html">Home</a>
        <a class="text-white" href="shop.html">Annunci</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="row">

      <aside class="col-12 col-md-3 mb-4">
        <h4>Filtri</h4>

        <!-- RICERCA NOME -->
        <div class="mb-3">
          <input type="text" id="searchInput" class="form-control" placeholder="Cerca oggetto...">
        </div>

        <!-- FILTRO PREZZO -->
        <h5>Prezzo</h5>
        <div class="mb-3">
          <label class="form-label">Minimo</label>
          <input type="number" id="minPrice" class="form-control" placeholder="0" min="0">
        </div>
        <div class="mb-3">
          <label class="form-label">Massimo</label>
          <input type="number" id="maxPrice" class="form-control" placeholder="100000" min="0">
        </div>

        <!-- CATEGORIE -->
        <h5>Categorie</h5>
        <div id="radioWrapper"></div>
      </aside>

      <section class="col-12 col-md-9">
        <div id="cardWrapper" class="row g-3"></div>
      </section>

    </div>
  </main>

  <script src="shop.js"></script>
</body>
</html>
